name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    uses: mzeeshan1/ci-workflows/.github/workflows/semantic-release.yml@main
    with:
      monorepo_dirs: "aws" # empty = single repo
    secrets:
      gh_token: ${{ secrets.GH_TOKEN }}
